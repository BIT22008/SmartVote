<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartVote | Voter Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <link rel="stylesheet" href="register.css">

</head>
<body>

<div class="container">
    <div class="card registration-card">
        <div class="card-header">
            <h3><i class="fas fa-user-plus me-2"></i>Voter Registration</h3>
            <p class="mb-0">Please fill in your details to get verified</p>
        </div>
        <div class="card-body p-4">
            <form action="/submit-registration " id="registrationForm" method="POST">
                
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control" name="fullname" placeholder="Enter your full name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">CNIC Number</label>
                        <input type="text" class="form-control" name="cnic" placeholder="xxxxx-xxxxxxx-x" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Employee ID</label>
                        <input type="text" class="form-control" name="employee_id" placeholder="ID-12345" required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" class="form-control" name="email" placeholder="example@org.com" required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold">Date of Birth</label>
                        <input type="date" class="form-control" name="dob" required>
                    </div>

                    <div class="col-md-12 mb-4">
                        <label class="form-label fw-bold">Biometric Verification (Thumb Print)</label>
                        <div class="thumb-print-box" onclick="simulateBiometric()">
                            <i class="fas fa-fingerprint fa-3x mb-2 text-muted" id="fingerIcon"></i>
                            <p id="biometricStatus" class="mb-0 text-muted">Click to scan your thumb impression</p>
                            <input type="hidden" name="thumb_data" id="thumb_data">
                        </div>
                    </div>
                </div>

               <div class="d-grid mt-4">
    <button type="button" id="submitBtn" class="btn btn-verify" onclick="handleRegistration()">
        <span id="btnText">SUBMIT & VERIFY</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
    </button>
</div>
            </form>
        </div>
        <div class="card-footer text-center bg-white border-0 pb-4">
            <small class="text-muted">Already registered? <a href="login.html" class="text-decoration-none">Login here</a></small>
        </div>
    </div>
</div>

<script>
    function simulateBiometric() {
        const status = document.getElementById('biometricStatus');
        const icon = document.getElementById('fingerIcon');
        
        status.innerText = "Scanning... Please wait";
        icon.classList.add('text-primary');
        
        setTimeout(() => {
            status.innerText = "Thumb Impression Captured Successfully!";
            status.classList.remove('text-muted');
            status.classList.add('text-success');
            icon.classList.remove('text-primary');
            icon.classList.add('text-success');
            document.getElementById('thumb_data').value = "biometric_template_xyz_123";
        }, 2000);
    }
</script>
<script>
function handleRegistration() {
    // 1. Saari input fields ko pakrain
    const form = document.getElementById('registrationForm');
    const btn = document.getElementById('submitBtn');
    const text = document.getElementById('btnText');
    const spinner = document.getElementById('btnSpinner');
    const thumbData = document.getElementById('thumb_data').value;

    // 2. Browser ki default validation check karein (Required fields)
    if (!form.checkValidity()) {
        form.reportValidity(); // Ye user ko error show karega (e.g. "Please fill out this field")
        return;
    }

    // 3. Custom check for Biometric (Thumb scan lazmi hai)
    if (!thumbData) {
        alert("Security Alert: Please scan your thumb impression before submitting!");
        return;
    }

    // 4. Agar sab theek hai, to processing start karein
    text.innerText = "Verifying Credentials...";
    spinner.classList.remove('d-none');
    btn.disabled = true;

    // 5. 2.5 seconds baad success page par bhej dein
    setTimeout(() => {
        window.location.href = "success.html"; 
    }, 2500);
}
</script>

</body>
</html>
