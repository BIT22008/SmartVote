<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful | SmartVote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background: #f8fafc; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif; 
        }
        .success-card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 450px; 
        }
        .icon-circle { 
            width: 100px; 
            height: 100px; 
            background: #dcfce7; 
            color: #16a34a; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 20px; 
            border: 2px solid #bbf7d0;
        }
        /* Tick icon size fix */
        .icon-circle i {
            font-size: 50px !important;
            display: block !important;
        }
        .btn-success {
            background-color: #16a34a;
            border: none;
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-circle">
        <i class="fas fa-check-double"></i>
    </div>
    <h2 class="fw-bold">Registration Successful!</h2>
    <p class="text-muted">
        Your details have been successfully verified. You are now authorized to participate in the upcoming elections.
    </p>
    <a href="login.html" class="btn btn-success w-100 py-2 mt-3 shadow-sm">
        PROCEED TO LOGIN <i class="fas fa-arrow-right ms-2"></i>
    </a>
</div>

</body>
</html>
